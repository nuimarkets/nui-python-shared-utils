# Markdownlint configuration for nui-python-shared-utils
# Shared rules are vendored by sync-markdownlint.sh.

config:
  extends: .markdownlint-base.yaml

# File patterns to check
globs:
  - "**/*.md"

# Exclusions
ignores:
  - "node_modules/**"
  - "vendor/**"
  - ".git/**"
  - "venv/**"
  - ".venv/**"
