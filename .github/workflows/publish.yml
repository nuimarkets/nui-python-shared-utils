name: Build and Publish to PyPI

on:
  push:
    tags:
      - '[0-9]*'  # Trigger on version tags like 1.3.0 (a published GitHub Release also creates the tag)
  workflow_dispatch:  # Allow manual triggering

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing test requirements..."
        pip install -r requirements-test.txt
        echo "Installing package..."
        pip install -e .
        echo "Verifying key dependencies:"
        python -c "import elasticsearch; print('✓ elasticsearch')" || echo "✗ elasticsearch missing"
        python -c "import slack_sdk; print('✓ slack_sdk')" || echo "✗ slack_sdk missing" 
        python -c "import pymysql; print('✓ pymysql')" || echo "✗ pymysql missing"
    
    - name: Run tests
      run: |
        pytest --cov=nui_shared_utils --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
        fetch-depth: 0  # Full history for version calculation
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: |
        twine check dist/*
        python -m tarfile -l dist/*.tar.gz
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v6
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, build]
    # Only publish on tagged releases
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/project/nui-python-shared-utils/
    
    permissions:
      id-token: write  # For trusted publishing
      contents: read
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v7
      with:
        name: dist
        path: dist/
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        print-hash: true
        skip-existing: true  # No-op instead of failing if the version is already on PyPI (safe re-runs)