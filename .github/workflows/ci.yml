name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing test requirements..."
        pip install -r requirements-test.txt
        echo "Installing package..."
        pip install -e .
        echo "Verifying key dependencies:"
        python -c "import elasticsearch; print('✓ elasticsearch')" || echo "✗ elasticsearch missing"
        python -c "import slack_sdk; print('✓ slack_sdk')" || echo "✗ slack_sdk missing" 
        python -c "import pymysql; print('✓ pymysql')" || echo "✗ pymysql missing"
    
    - name: Auto-format with black
      run: |
        black nui_shared_utils tests
        if ! git diff --quiet; then
          echo "::warning::Code was auto-formatted by Black"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Auto-format code with Black [skip ci]" || echo "No changes to commit"
        else
          echo "✅ Code is already properly formatted"
        fi
    
    - name: Type check with mypy
      run: |
        mypy nui_shared_utils --ignore-missing-imports
      continue-on-error: true  # Don't fail CI on type errors yet
    
    - name: Test with pytest
      run: |
        pytest --cov=nui_shared_utils --cov-report=xml --cov-report=term-missing -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  es-compat:
    name: Elasticsearch client ${{ matrix.elasticsearch-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every major the [elasticsearch] extra allows. The ES tests drive the
        # real client with a stubbed transport, so a call shape that a major
        # stops accepting fails here. 8.x is pinned at three points because the
        # client handles `body=` differently across the major: 8.0-8.11 route it
        # through the parameter-rewriting fallback, 8.12+ take it as a declared
        # parameter, and a bare `8.*` only ever resolves to the latter.
        elasticsearch-version: ['7.17.*', '8.0.*', '8.11.*', '8.*', '9.*']

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-mock
        pip install -e .
        pip install "elasticsearch==${{ matrix.elasticsearch-version }}"
        python -c "import elasticsearch; print('elasticsearch', elasticsearch.__version__)"

    - name: Test Elasticsearch client
      run: |
        pytest tests/test_es_client.py tests/test_es_client_compat.py tests/test_es_query_builder.py -v

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package integrity
      run: |
        twine check dist/*
        echo "Package contents:"
        python -m tarfile -l dist/*.tar.gz | head -20
        echo "Wheel contents:"
        python -m zipfile -l dist/*.whl | head -20
    
    - name: Test installation
      run: |
        pip install dist/*.whl
        python -c "import nui_shared_utils; print('✅ Package imports successfully')"
        python -c "from nui_shared_utils import Config, get_secret; print('✅ Core imports work')"