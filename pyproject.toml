[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nui-python-shared-utils"
dynamic = ["version"]
authors = [
    {name = "NUI Markets", email = "develop@nuimarkets.com"},
]
description = "Shared Python utilities for AWS Lambda, CLI tools, and agents with Slack, Elasticsearch, and monitoring integrations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Environment :: Console",
    "Framework :: AWS CDK",
]
keywords = ["aws", "lambda", "utilities", "slack", "elasticsearch", "monitoring", "serverless", "python", "shared"]
dependencies = [
    "boto3>=1.20.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    # Zone data for stdlib `zoneinfo`, which otherwise reads the system IANA
    # database. Windows ships none; POSIX systems do, so they pay nothing here.
    "tzdata>=2023.3; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Client majors 7.17, 8.x and 9.x are all supported: es_client sends one call
# shape that is valid on each (see ADR-007). The <10 ceiling is the untested
# next major, not a known incompatibility.
elasticsearch = ["elasticsearch>=7.17.0,<10.0.0"]
database = ["pymysql>=1.0.0", "psycopg2-binary>=2.9.0"]
slack = ["slack-sdk>=3.19.0"]
powertools = [
    "aws-lambda-powertools>=3.6.0,<4.0.0",
    "coloredlogs>=15.0",
]
jwt = ["rsa>=4.9"]
# Zone data for images that carry no system IANA database (Alpine, distroless).
# Not expressible as an environment marker, hence an opt-in extra. Unneeded on
# a normal Linux/macOS install or an AWS Lambda runtime.
timezone = ["tzdata>=2023.3"]
# Pinned to the published PyPI release (no direct-URL deps, PyPI rejects those
# on upload). Kept out of `all`: opt-in.
snowflake = [
    "snowflake-sql-api>=0.1.1,<0.2.0",
]
# Anthropic (Claude) helper. anthropic[bedrock] covers both auth modes (API key
# + Bedrock IAM). Kept out of `all` (same as snowflake): the SDK is specialized
# and opt-in. Keep in sync with setup.py.
llm = ["anthropic[bedrock]>=0.45.0,<1.0.0"]
all = [
    "elasticsearch>=7.17.0,<10.0.0",
    "pymysql>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "slack-sdk>=3.19.0",
    "aws-lambda-powertools>=3.6.0,<4.0.0",
    "coloredlogs>=15.0",
    "rsa>=4.9",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "moto>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.990",
    "boto3-stubs[essential]>=1.20.0",
    "types-PyYAML>=6.0.0",
    "twine>=4.0.0",
    "build>=0.8.0",
    "rsa>=4.9",
    "cryptography>=41.0.0",
    # Lets the test suite exercise the zone-data fallback on a host that has a
    # system IANA database; see the [timezone] extra.
    "tzdata>=2023.3",
    "snowflake-sql-api>=0.1.1,<0.2.0",
    "anthropic[bedrock]>=0.45.0,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/nuimarkets/nui-python-shared-utils"
"Bug Tracker" = "https://github.com/nuimarkets/nui-python-shared-utils/issues"
Documentation = "https://github.com/nuimarkets/nui-python-shared-utils/blob/main/README.md"
Source = "https://github.com/nuimarkets/nui-python-shared-utils"

[project.scripts]
slack-channel-setup = "nui_shared_utils.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nui_shared_utils*"]

[tool.setuptools.package-data]
"nui_shared_utils" = ["slack_setup/*.yaml"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = false
no_implicit_optional = false
check_untyped_defs = false
disallow_untyped_defs = false

[tool.coverage.run]
source = ["nui_shared_utils"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
precision = 2
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
[tool.ruff.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "TRY003"]

[tool.setuptools_scm]
# Automatically derive version from git tags
# Tag format: v1.0.1 -> version 1.0.1
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
