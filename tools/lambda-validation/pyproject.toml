[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nui-lambda-validation"
version = "0.1.0"
description = "Build-time checks for Python AWS Lambda deployment ZIPs, runtime images and offline test runs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# The checks parse requirement strings and markers. One exact pin keeps the tool's
# own closure fixed, separate from every application it checks.
dependencies = ["packaging==26.3"]

[project.scripts]
nui-lambda-validation = "nui_lambda_validation.cli:main"

[tool.setuptools]
packages = ["nui_lambda_validation"]
